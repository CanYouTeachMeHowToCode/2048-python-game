[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "game2048"
version = "0.1.0"
requires-python = ">=3.8"

[project.scripts]
play2048 = "game2048.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
